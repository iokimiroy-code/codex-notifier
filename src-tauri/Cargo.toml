[package]
name = "codex-notifier"
version = "1.0.0"
description = "Codex 提示音 desktop companion"
authors = ["Codex 提示音团队"]
edition = "2021"

[lib]
name = "codex_notifier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
